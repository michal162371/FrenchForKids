<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>צרפתית בכיף!</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff6e0;--card:#ffffff;--ink:#23305a;--blue:#2f6fed;--red:#ef476f;--yellow:#ffd23f;--green:#1fb57a;--soft:#e7eefc;--shadow:#23305a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17203d;--card:#25305a;--ink:#f6f1e3;--soft:#33407a;--shadow:#0b1128}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Rubik',Arial,sans-serif;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1,.fr{font-family:'Baloo 2','Rubik',Arial,sans-serif}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.top h1{margin:0;font-size:28px}
.stars{background:var(--yellow);color:#23305a;border-radius:20px;padding:4px 14px;font-weight:800}
.flag{display:inline-flex;width:34px;height:22px;border-radius:4px;overflow:hidden;vertical-align:middle;margin-inline-start:8px;border:2px solid var(--shadow)}
.flag i{flex:1}.flag i:nth-child(1){background:#2f6fed}.flag i:nth-child(2){background:#fff}.flag i:nth-child(3){background:#ef476f}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:4px solid var(--yellow);outline-offset:2px}
.topic{background:var(--card);border:3px solid var(--shadow);border-radius:22px;box-shadow:0 5px 0 var(--shadow);padding:18px 8px;text-align:center;font-weight:800;font-size:18px}
.topic span{display:block;font-size:44px;margin-bottom:4px}
.topic small{display:block;font-weight:400;opacity:.7}
.topic:active,.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--shadow)}
.btn{background:var(--blue);color:#fff;border:3px solid var(--shadow);border-radius:16px;box-shadow:0 4px 0 var(--shadow);padding:10px 20px;font-weight:800;font-size:18px}
.btn.alt{background:var(--card);color:var(--ink)}
.btn.green{background:var(--green)}
.row{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.card{background:var(--card);border:3px solid var(--shadow);border-radius:28px;box-shadow:0 6px 0 var(--shadow);padding:24px 16px;text-align:center}
.emoji{font-size:96px;line-height:1.1}
.fr{font-size:46px;margin:6px 0 0;direction:ltr}
.he{font-size:22px;opacity:.8;margin-top:2px}
.say{background:var(--yellow);color:#23305a}
.prog{height:12px;background:var(--soft);border-radius:8px;overflow:hidden;margin:12px 0}
.prog div{height:100%;background:var(--green);transition:width .3s}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.opt{background:var(--soft);border:3px solid var(--shadow);border-radius:18px;padding:14px 6px;font-size:30px;font-weight:700;box-shadow:0 4px 0 var(--shadow)}
.opt.ok{background:var(--green);color:#fff}
.opt.no{background:var(--red);color:#fff;animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.msg{min-height:30px;font-size:20px;font-weight:800;margin-top:12px}
.big{font-size:64px}
.avs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.av{font-size:38px;background:var(--soft);border:3px solid var(--shadow);border-radius:16px;padding:6px}
.av.sel{background:var(--yellow);transform:scale(1.08)}
input.nm,select.nm{font:inherit;font-size:24px;text-align:center;width:100%;padding:12px;border:3px solid var(--shadow);border-radius:16px;background:var(--card);color:var(--ink)}
.lb{list-style:none;padding:0;margin:12px 0 0;text-align:start}
.lb li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:var(--soft);margin-bottom:8px;font-size:20px;font-weight:600}
.lb li.me{background:var(--yellow);color:#23305a}
.lb .rk{width:34px;font-size:24px;text-align:center}.lb .n{flex:1;overflow:hidden;text-overflow:ellipsis}.lb .v{font-weight:800}
.tabs{display:flex;gap:8px;justify-content:center}
.tabs .btn{font-size:16px;padding:8px 14px}
.tabs .on{background:var(--yellow);color:#23305a}
.who{display:flex;gap:8px;align-items:center}
.who button{background:none;border:0;font-size:20px;padding:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const TOPICS=[
{id:'animals',name:'חיות',icon:'🐶',words:[['chien','🐶','כלב'],['chat','🐱','חתול'],['oiseau','🐦','ציפור'],['poisson','🐟','דג'],['cheval','🐴','סוס'],['lapin','🐰','ארנב']]},
{id:'colors',name:'צבעים',icon:'🎨',words:[['rouge','🔴','אדום'],['bleu','🔵','כחול'],['jaune','🟡','צהוב'],['vert','🟢','ירוק'],['orange','🟠','כתום'],['violet','🟣','סגול']]},
{id:'numbers',name:'מספרים',icon:'🔢',words:[['un','1️⃣','אחד'],['deux','2️⃣','שניים'],['trois','3️⃣','שלוש'],['quatre','4️⃣','ארבע'],['cinq','5️⃣','חמש'],['six','6️⃣','שש']]},
{id:'food',name:'אוכל',icon:'🍎',words:[['pomme','🍎','תפוח'],['pain','🍞','לחם'],['lait','🥛','חלב'],['fromage','🧀','גבינה'],['banane','🍌','בננה'],['gâteau','🍰','עוגה']]},
{id:'hello',name:'שלום!',icon:'👋',words:[['bonjour','👋','שלום / בוקר טוב'],['merci','🙏','תודה'],['oui','✅','כן'],['non','❌','לא'],['bonne nuit','🌙','לילה טוב'],['au revoir','👋🏽','להתראות']]},
{id:'family',name:'משפחה',icon:'👨‍👩‍👧',words:[['maman','👩','אמא'],['papa','👨','אבא'],['frère','👦','אח'],['sœur','👧','אחות'],['bébé','👶','תינוק'],['ami','🧑‍🤝‍🧑','חבר']]}
];
const AVS=['🦊','🐼','🦁','🐸','🐙','🦄','🐯','🐵'];
let P={name:'',avatar:'🦊',stars:0,quizzes:0,cards:0},ME=null,DB=null,ALL=[],ready=false,lbTab='stars';
const app=document.getElementById('app');
let VOICE=null,VOICES=[],RATE=.8;
try{const r=parseFloat(localStorage.getItem('fk_rate'));if(r)RATE=r}catch(e){}
function frScore(v){let n=0;const x=(v.name+' '+v.voiceURI).toLowerCase();
if(v.lang.replace('_','-').toLowerCase()==='fr-fr')n+=10;
if(/premium|enhanced|natural|neural/.test(x))n+=8;
if(/siri|google|amélie|amelie|thomas|audrey|denise|henri|eloise|vivienne/.test(x))n+=4;
if(v.localService)n+=1;return n}
function loadVoices(){try{
VOICES=speechSynthesis.getVoices().filter(v=>/^fr/i.test(v.lang)).sort((a,b)=>frScore(b)-frScore(a));
let sv=null;try{sv=localStorage.getItem('fk_voice')}catch(e){}
VOICE=VOICES.find(v=>v.voiceURI===sv)||VOICES[0]||null}catch(e){}}
try{loadVoices();speechSynthesis.addEventListener('voiceschanged',loadVoices)}catch(e){}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);
u.lang=VOICE?VOICE.lang:'fr-FR';if(VOICE)u.voice=VOICE;u.rate=RATE;speechSynthesis.speak(u)}catch(e){}}
function setVoice(uri){VOICE=VOICES.find(v=>v.voiceURI===uri)||VOICE;try{localStorage.setItem('fk_voice',uri)}catch(e){}say('Bonjour ! Comment ça va ?')}
function setRate(r){RATE=r;try{localStorage.setItem('fk_rate',String(r))}catch(e){}voiceSet();say('Bonjour ! Comment ça va ?')}
function voiceSet(){
loadVoices();
app.innerHTML=header()+`<div class="card"><h2 style="margin:0 0 10px">🔊 הגדרות קול</h2>
${VOICES.length?`<p style="margin:0 0 8px">בחרו קול צרפתי:</p><select class="nm" style="font-size:18px" onchange="setVoice(this.value)">${VOICES.map(v=>`<option value="${esc(v.voiceURI)}" ${v===VOICE?'selected':''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('')}</select>`:'<p>לא נמצא קול צרפתי במכשיר. אפשר להתקין אחד בהגדרות המכשיר (שפה, נגישות או דיבור) ואז לחזור לכאן.</p>'}
<p style="margin:16px 0 8px">מהירות הדיבור:</p>
<div class="tabs">${[['איטי',.65],['רגיל',.8],['מהיר',1]].map(a=>`<button class="btn ${RATE===a[1]?'on':'alt'}" onclick="setRate(${a[1]})">${a[0]}</button>`).join('')}</div>
<div class="row"><button class="btn say" onclick="say('Bonjour ! Comment ça va ?')">🔊 בדיקה</button><button class="btn" onclick="home()">חזרה</button></div></div>`}
function shuffle(a){return a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1])}
function esc(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML}
function header(){return `<div class="top"><h1>צרפתית בכיף<span class="flag"><i></i><i></i><i></i></span></h1><div class="who"><div class="stars">⭐ ${P.stars}</div></div></div>`}
function home(){
app.innerHTML=header()+`<p style="font-size:20px;margin:0 0 14px">שלום ${esc(P.name)}! בחרו נושא ותלמדו מילים חדשות. לחצו 🔊 כדי לשמוע!</p><div class="grid">`+
TOPICS.map((t,i)=>`<button class="topic" onclick="learn(${i})"><span>${t.icon}</span>${t.name}<small>${t.words.length} מילים</small></button>`).join('')+`</div><div class="row"><button class="btn green" onclick="board()">🏆 לוח דירוג</button><button class="btn alt" onclick="login()">${P.avatar} ${esc(P.name)} · החלפה</button><button class="btn alt" onclick="voiceSet()">🔊 קול</button></div>`}
let T,idx;
function learn(i){T=TOPICS[i];idx=0;showCard()}
function showCard(){
const w=T.words[idx];
app.innerHTML=header()+`<div class="prog"><div style="width:${(idx+1)/T.words.length*100}%"></div></div>
<div class="card"><div class="emoji">${w[1]}</div><div class="fr">${w[0]}</div><div class="he">${w[2]}</div>
<div class="row"><button class="btn say" onclick="say('${w[0].replace(/'/g,"\\'")}')">🔊 שמעו</button></div></div>
<div class="row">${idx>0?`<button class="btn alt" onclick="idx--;showCard()">הקודם</button>`:''}
${idx<T.words.length-1?`<button class="btn" onclick="idx++;showCard()">הבא</button>`:`<button class="btn green" onclick="quiz()">לחידון!</button>`}
<button class="btn alt" onclick="home()">בית</button></div>`;
P.cards++;save();setTimeout(()=>say(w[0]),150)}
let Q,qi,score,locked;
function quiz(){Q=shuffle(T.words).slice(0,5);qi=0;score=0;showQ()}
function showQ(){
locked=false;const w=Q[qi];
const wrong=shuffle(T.words.filter(x=>x!==w)).slice(0,3);
const opts=shuffle([w,...wrong]);
const mode=qi%2; // 0: hear/see French -> pick emoji ; 1: see emoji -> pick French
const prompt=mode===0?`<div class="fr">${w[0]}</div><div class="he">איזו תמונה מתאימה?</div>`:`<div class="emoji">${w[1]}</div><div class="he">איך אומרים את זה בצרפתית?</div>`;
app.innerHTML=header()+`<div class="prog"><div style="width:${qi/Q.length*100}%"></div></div>
<div class="card">${prompt}<div class="row"><button class="btn say" onclick="say('${w[0].replace(/'/g,"\\'")}')">🔊</button></div>
<div class="opts">${opts.map(o=>`<button class="opt ${mode?'fr':''}" data-r="${o===w?1:0}" onclick="pick(this,${mode})">${mode===0?o[1]:o[0]}</button>`).join('')}</div>
<div class="msg" id="msg"></div></div>`;
if(mode===0)say(w[0])}
function pick(b,mode){
if(locked)return;const m=document.getElementById('msg');
if(b.dataset.r==='1'){locked=true;b.classList.add('ok');score++;P.stars++;save();m.textContent='כל הכבוד! 🎉';
setTimeout(()=>{qi++;qi<Q.length?showQ():done()},900)}
else{b.classList.add('no');m.textContent='כמעט! נסו שוב 💪';b.disabled=true}}
function done(){
app.innerHTML=header()+`<div class="card"><div class="big">${score>=4?'🏆':'🌟'}</div><h2>סיימתם! ${score} מתוך ${Q.length}</h2><p style="font-size:20px">${score>=4?'מצוין! Très bien!':'יפה מאוד! אפשר לחזור על המילים ולנסות שוב.'}</p>
<div class="row"><button class="btn" onclick="quiz()">עוד פעם</button><button class="btn alt" onclick="learn(TOPICS.indexOf(T))">ללמוד שוב</button><button class="btn green" onclick="home()">נושא חדש</button></div></div>`;
P.quizzes++;save();say('Bravo')}


let PID=null,selAv='🦊';const TM={};
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let LOCAL=LS.get('fk_profiles',{});
function pidOf(n){let h=5381;for(const c of n.trim().toLowerCase())h=((h<<5)+h+c.charCodeAt(0))>>>0;return 'p'+h.toString(36)}
function save(){
if(!PID)return;const id=PID,rec={name:P.name,avatar:P.avatar,stars:P.stars,quizzes:P.quizzes,cards:P.cards,seen:Date.now()};
LOCAL[id]=rec;LS.set('fk_profiles',LOCAL);LS.set('fk_current',id);
if(DB){clearTimeout(TM[id]);TM[id]=setTimeout(()=>{DB.doc('players/'+id).set(rec).catch(()=>{})},800)}}
function login(){
const ids=Object.keys(LOCAL);
app.innerHTML=`<div class="top"><h1>מי משחק?</h1></div>
${ids.length?`<div class="grid">${ids.map(id=>`<button class="topic" onclick="chooseP('${id}')"><span>${esc(LOCAL[id].avatar||'🙂')}</span>${esc(LOCAL[id].name)}<small>⭐ ${LOCAL[id].stars||0}</small></button>`).join('')}</div><h3 style="text-align:center">או שחקן חדש</h3>`:''}
<div class="card"><div class="big" id="bigav">${selAv}</div>
<input class="nm" id="nm" maxlength="14" placeholder="הכינוי שלך" autocomplete="off">
<div class="avs">${AVS.map(a=>`<button class="av ${a===selAv?'sel':''}" onclick="setAv('${a}')">${a}</button>`).join('')}</div>
<div class="msg" id="lm"></div><button class="btn green" onclick="go()">יאללה, מתחילים!</button>
${PID?`<div class="row"><button class="btn alt" onclick="home()">חזרה</button></div>`:''}</div>`}
function setAv(a){selAv=a;document.getElementById('bigav').textContent=a;document.querySelectorAll('.av').forEach(b=>b.classList.toggle('sel',b.textContent===a))}
function chooseP(id){save();PID=id;P={name:'',avatar:'🦊',stars:0,quizzes:0,cards:0,...LOCAL[id]};LS.set('fk_current',id);home()}
function go(){
const v=document.getElementById('nm').value.trim();
if(!v){document.getElementById('lm').textContent='כתבו כינוי כדי להתחיל';return}
save();const id=pidOf(v);
if(LOCAL[id]){P={name:v,avatar:'🦊',stars:0,quizzes:0,cards:0,...LOCAL[id]}}else{P={name:v,avatar:selAv,stars:0,quizzes:0,cards:0}}
PID=id;save();home()}
function board(){
const src=DB?ALL:Object.keys(LOCAL).map(id=>({id,...LOCAL[id]}));
const sc=p=>lbTab==='stars'?(p.stars||0):((p.cards||0)+(p.quizzes||0)*5);
const list=src.slice().sort((a,b)=>sc(b)-sc(a)).slice(0,10);
const medal=['🥇','🥈','🥉'];
app.innerHTML=header()+`<div class="card"><h2 style="margin:0 0 10px">🏆 לוח דירוג</h2>
<div class="tabs"><button class="btn ${lbTab==='stars'?'on':'alt'}" onclick="lbTab='stars';board()">⭐ כוכבים</button><button class="btn ${lbTab==='act'?'on':'alt'}" onclick="lbTab='act';board()">📚 פעילות</button></div>
${list.length?`<ul class="lb">${list.map((p,i)=>`<li class="${p.id===PID?'me':''}"><span class="rk">${medal[i]||i+1}</span><span>${esc(p.avatar||'🙂')}</span><span class="n">${esc(p.name||'?')}</span><span class="v">${sc(p)} ${lbTab==='stars'?'⭐':'📚'}</span></li>`).join('')}</ul>`:'<p>עוד אין שחקנים. היו הראשונים!</p>'}
<p style="font-size:14px;opacity:.7">פעילות = כרטיסיות שנצפו + 5 לכל חידון שהושלם${DB?'':' · הדירוג כאן הוא של המכשיר הזה בלבד'}</p>
<div class="row"><button class="btn" onclick="home()">חזרה</button></div></div>`}
async function boot(){
app.innerHTML='<div class="card"><div class="big">🇫🇷</div><p>טוען...</p></div>';
try{DB=await claude.use('db');
if(DB)DB.collection('players').onSnapshot(q=>{ALL=q.docs.map(d=>({id:d.id,...d.data()}));if(document.querySelector('.lb'))board()},()=>{})}catch(e){DB=null}
const cur=LS.get('fk_current',null);
if(cur&&LOCAL[cur]){PID=cur;P={name:'',avatar:'🦊',stars:0,quizzes:0,cards:0,...LOCAL[cur]};
if(DB){try{const s=await DB.doc('players/'+cur).get();if(s.exists){const d=s.data();['stars','quizzes','cards'].forEach(k=>{P[k]=Math.max(P[k]||0,d[k]||0)});save()}}catch(e){}}
home()}else login()}
boot();
</script>
</body>
</html>
